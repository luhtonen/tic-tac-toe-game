<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="game">
    <h1>Tic-Tac-Toe</h1>
    <p class="subtitle">Two players, one seat</p>

    <div class="scoreboard">
      <div class="score">
        <span class="score-label x">Player X</span>
        <span class="score-value" id="score-x">0</span>
      </div>
      <div class="score">
        <span class="score-label">Draws</span>
        <span class="score-value" id="score-draws">0</span>
      </div>
      <div class="score">
        <span class="score-label o">Player O</span>
        <span class="score-value" id="score-o">0</span>
      </div>
    </div>

    <p class="status" id="status" aria-live="polite">Player X's turn</p>

    <div class="board" id="board"></div>

    <div class="actions">
      <button type="button" id="new-round">New round</button>
      <button type="button" id="reset-all">Reset scores</button>
    </div>
  </main>

  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
